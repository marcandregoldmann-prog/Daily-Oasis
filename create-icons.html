<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <script>
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, 0, size, size);

            // Circle background
            ctx.fillStyle = '#E8D4C4';
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2.4, 0, Math.PI * 2);
            ctx.fill();

            // Palm trunk
            ctx.fillStyle = '#8B6F47';
            const trunkWidth = size * 0.166;
            const trunkHeight = size * 0.312;
            ctx.fillRect(size / 2 - trunkWidth / 2, size * 0.52, trunkWidth, trunkHeight);

            // Palm leaves
            ctx.fillStyle = '#6B8E7F';
            
            // Helper function to draw rotated ellipse
            const drawRotatedEllipse = (cx, cy, rx, ry, angle) => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.fillRect(-rx / 2, -ry / 2, rx, ry);
                ctx.restore();
            };

            // Leaves
            drawRotatedEllipse(size * 0.365, size * 0.312, size * 0.208, size * 0.26, -0.6);
            drawRotatedEllipse(size * 0.635, size * 0.312, size * 0.208, size * 0.26, 0.6);
            drawRotatedEllipse(size * 0.5, size * 0.208, size * 0.208, size * 0.26, 0);

            return canvas.toDataURL('image/png');
        }

        const icon192 = createIcon(192);
        const icon512 = createIcon(512);

        console.log('Icon 192x192:', icon192.substring(0, 50) + '...');
        console.log('Icon 512x512:', icon512.substring(0, 50) + '...');

        // For server-side generation, you would pass these to a service
    </script>
    <p>Open console to see generated icons</p>
</body>
</html>
